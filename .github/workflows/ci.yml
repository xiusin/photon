name: CI/CD — Photon Framework

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # 只匹配最新 V：本条流水线基线为 V 0.5.2（json2 / select mut 语义 / &mut 回调）。
  # setup-v 抓不到 -> vlang/v 的最新 main tag；Dockerfile 用同一分支。
  V_BRANCH: '0.5.2'
  APP_NAME: photon

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Build & Test (all PRs, all pushes)
  # ──────────────────────────────────────────────
  test:
    name: 'Test (${{ matrix.module }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - core
          - config
          - logger
          - security
          - cli
          - web
          - orm
          - http
          - queue
          - strutil
          - pageable
          - ticker
          - cache
          - pool
          - locking
          - async
          - photon_i18n
          - health
          - metrics
          - mailer
          - retry
          - storage
          - tracing
          - apidoc
    steps:
      - uses: actions/checkout@v4

      - name: Setup V (cached)
        uses: alexesprit/setup-v@v1
        with:
          v-version: '0.5.2'

      - name: Install native deps
        run: |
          # libargon2-dev: security/hashing.v links argon2_bridge.c
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libargon2-dev

      - name: Link vendored dependencies
        run: |
          # 唯一的第三方代码（xiusin.vredis）vendor 在 vendor/modules/ 下。
          # 不再 `v install`，也不再给上游打补丁 —— CI 跑的就是仓库里这份源码。
          sh scripts/sync-vendor.sh

      - name: Verify V
        run: |
          v --version
          v doctor 2>&1 || true

      - name: Test ${{ matrix.module }}
        timeout-minutes: 15
        run: |
          cd photon
          # 逐文件跑 + 每条命令 30s 熔断：单个用例死锁只会判 TIMEOUT 并强杀，
          # 不会把整个 job 挂到 GitHub Actions 的 6h 上限。
          sh scripts/run-tests.sh ${{ matrix.module }} || {
            echo "::error::Module ${{ matrix.module }} tests failed or timed out"
            exit 1
          }

  # ──────────────────────────────────────────────
  # Stage 1b: Vendored dependency (xiusin.vredis) — 真连真用
  # ──────────────────────────────────────────────
  test-vendor:
    name: 'Test (vendored xiusin.vredis)'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup V
        uses: alexesprit/setup-v@v1
        with:
          v-version: '0.5.2'

      - name: Link vendored dependencies
        run: sh scripts/sync-vendor.sh

      - name: Test vendored vredis
        timeout-minutes: 10
        run: |
          # Redis 不可达时用例会长时间重试，必须熔断。
          timeout -k 5 30 v -enable-globals test -stats vendor/modules/xiusin/vredis/ || {
            rc=$?
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error::vendored vredis tests timed out (30s/file)"
            else
              echo "::error::vendored vredis tests failed (rc=$rc)"
            fi
            exit 1
          }

  test-summary:
    name: 'All Tests Passed'
    runs-on: ubuntu-latest
    needs: [test, test-vendor]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "All module tests completed"
          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.test-vendor.result }}" == "success" ]]; then
            echo "::notice::✅ All tests passed"
          elif [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "::error::❌ Some tests failed"
            exit 1
          else
            echo "::warning::⚠️ Tests cancelled or skipped"
          fi

  # ──────────────────────────────────────────────
  # Stage 2: Build Example (on push to main/master)
  # ──────────────────────────────────────────────
  build:
    name: 'Build Example'
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Setup V
        uses: alexesprit/setup-v@v1
        with:
          v-version: '0.5.2'

      - name: Install native deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libargon2-dev

      - name: Link vendored dependencies
        run: |
          sh scripts/sync-vendor.sh

      - name: Build example
        timeout-minutes: 15
        run: |
          cd photon
          # comptime 展开卡住时用 -k 10 300 强杀，避免占满整个 job。
          timeout -k 10 300 v -enable-globals -prod -o bin/${{ env.APP_NAME }} example/ || {
            echo "::error::example build failed or timed out"
            exit 1
          }
          echo "Binary: photon/bin/${{ env.APP_NAME }}"
          ls -lh photon/bin/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-binary
          path: photon/bin/${{ env.APP_NAME }}
          retention-days: 7

  # ──────────────────────────────────────────────
  # Stage 3: Docker Build (on main/master push)
  # ──────────────────────────────────────────────
  docker:
    name: 'Build & Push Docker Image'
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-binary
          path: photon/bin/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: photon/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
